<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计分析 - 私募基金监控平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <h1>统计分析</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-secondary" onclick="location.href='/'">
                    返回列表
                </button>
            </div>
        </header>

        <!-- 爬取记录 -->
        <div class="card">
            <div class="card-header">
                <h2>爬取记录</h2>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>爬取日期</th>
                        <th>开始时间</th>
                        <th>结束时间</th>
                        <th>状态</th>
                        <th>基金数量</th>
                        <th>OCR成功</th>
                        <th>错误信息</th>
                    </tr>
                </thead>
                <tbody id="crawlRecordsBody">
                    <tr>
                        <td colspan="8" class="loading-cell">
                            <div class="loading">加载中...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination" id="crawlRecordsPagination"></div>
        </div>

        <!-- 收益率图表 -->
        <div class="card">
            <div class="card-header">
                <h2>收益率分布</h2>
            </div>
            <div id="returnChart" style="width: 100%; height: 400px;"></div>
        </div>

        <!-- 回撤图表 -->
        <div class="card">
            <div class="card-header">
                <h2>回撤分布</h2>
            </div>
            <div id="drawdownChart" style="width: 100%; height: 400px;"></div>
        </div>
    </div>

    <script>
        let returnChart, drawdownChart;

        document.addEventListener('DOMContentLoaded', function() {
            loadCrawlRecords(1);
            initCharts();
            loadChartData();
        });

        function initCharts() {
            returnChart = echarts.init(document.getElementById('returnChart'));
            drawdownChart = echarts.init(document.getElementById('drawdownChart'));
        }

        function loadChartData() {
            fetch('/api/funds/latest')
                .then(r => r.json())
                .then(data => {
                    if (data.items && data.items.length > 0) {
                        renderReturnChart(data.items);
                        renderDrawdownChart(data.items);
                    }
                });
        }

        function renderReturnChart(funds) {
            // 解析今年来收益率
            const thisYearData = funds.map(f => {
                const val = f.this_year;
                if (!val) return null;
                const num = parseFloat(val.replace('%', ''));
                return isNaN(num) ? null : num;
            }).filter(v => v !== null);

            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: ['<-20%', '-20%~0%', '0%~20%', '20%~50%', '50%~100%', '>100%'],
                    axisLabel: { rotate: 0 }
                },
                yAxis: {
                    type: 'value',
                    name: '基金数量'
                },
                series: [{
                    name: '基金数量',
                    type: 'bar',
                    data: [
                        thisYearData.filter(v => v < -20).length,
                        thisYearData.filter(v => v >= -20 && v < 0).length,
                        thisYearData.filter(v => v >= 0 && v < 20).length,
                        thisYearData.filter(v => v >= 20 && v < 50).length,
                        thisYearData.filter(v => v >= 50 && v < 100).length,
                        thisYearData.filter(v => v >= 100).length
                    ],
                    itemStyle: {
                        color: function(params) {
                            const colors = ['#e74c3c', '#f39c12', '#2ecc71', '#27ae60', '#16a085', '#1abc9c'];
                            return colors[params.dataIndex];
                        }
                    }
                }]
            };
            returnChart.setOption(option);
        }

        function renderDrawdownChart(funds) {
            const drawdownData = funds.map(f => {
                const val = f.drawdown;
                if (!val) return null;
                const num = parseFloat(val.replace('%', ''));
                return isNaN(num) ? null : num;
            }).filter(v => v !== null);

            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: ['0~5%', '5~10%', '10~20%', '20~30%', '30~50%', '>50%'],
                    axisLabel: { rotate: 0 }
                },
                yAxis: {
                    type: 'value',
                    name: '基金数量'
                },
                series: [{
                    name: '基金数量',
                    type: 'bar',
                    data: [
                        drawdownData.filter(v => v >= 0 && v < 5).length,
                        drawdownData.filter(v => v >= 5 && v < 10).length,
                        drawdownData.filter(v => v >= 10 && v < 20).length,
                        drawdownData.filter(v => v >= 20 && v < 30).length,
                        drawdownData.filter(v => v >= 30 && v < 50).length,
                        drawdownData.filter(v => v >= 50).length
                    ],
                    itemStyle: {
                        color: function(params) {
                            const colors = ['#1abc9c', '#16a085', '#3498db', '#2980b9', '#9b59b6', '#8e44ad'];
                            return colors[params.dataIndex];
                        }
                    }
                }]
            };
            drawdownChart.setOption(option);
        }

        function loadCrawlRecords(page = 1) {
            fetch(`/api/crawl/records?page=${page}&per_page=10`)
                .then(r => r.json())
                .then(data => {
                    renderCrawlRecords(data.items);
                    renderCrawlRecordsPagination(data.page, data.pages);
                });
        }

        function renderCrawlRecords(records) {
            const tbody = document.getElementById('crawlRecordsBody');
            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-cell">暂无记录</td></tr>';
                return;
            }

            tbody.innerHTML = records.map(r => `
                <tr>
                    <td>${r.id}</td>
                    <td>${r.crawl_date}</td>
                    <td>${r.start_time ? r.start_time.substring(11, 19) : '-'}</td>
                    <td>${r.end_time ? r.end_time.substring(11, 19) : '-'}</td>
                    <td><span class="status-badge status-${r.status}">${getStatusText(r.status)}</span></td>
                    <td>${r.total_funds}</td>
                    <td>${r.ocr_success || '-'}</td>
                    <td class="error-text">${r.error_message || '-'}</td>
                </tr>
            `).join('');
        }

        function renderCrawlRecordsPagination(current, total) {
            const container = document.getElementById('crawlRecordsPagination');
            if (total <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= total; i++) {
                html += `<button class="${i === current ? 'active' : ''}" onclick="loadCrawlRecords(${i})">${i}</button>`;
            }
            container.innerHTML = html;
        }

        function getStatusText(status) {
            const map = {
                'running': '运行中',
                'success': '成功',
                'failed': '失败'
            };
            return map[status] || status;
        }
    </script>
</body>
</html>
