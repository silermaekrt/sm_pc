<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计分析 - 私募基金监控平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="/static/js/utils.js"></script>
    <!-- API 服务层 -->
    <script src="/static/js/services/fund-api.js"></script>
    <script src="/static/js/services/crawl-api.js"></script>
    <!-- 页面逻辑 -->
    <script src="/static/js/pages/stats-page.js"></script>
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <h1>统计分析</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-secondary" onclick="location.href='/'">
                    返回列表
                </button>
            </div>
        </header>

        <!-- 主Tab切换 -->
        <div class="card">
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="analysis" onclick="switchMainTab('analysis')">区间分析</button>
                <button class="tab-btn" data-tab="records" onclick="switchMainTab('records')">爬取记录</button>
            </div>
        </div>

        <!-- ==================== 区间分析 Tab ==================== -->
        <div id="tab-analysis" class="tab-content active">
            <!-- 时间序列分析控制栏 -->
            <div class="card">
                <div class="card-header">
                    <h2>时间序列分析</h2>
                </div>
                <div class="analysis-controls">
                    <div class="control-group">
                        <label>日期范围</label>
                        <div class="date-range-custom">
                            <input type="date" id="analysisStartDate" onchange="if(statsPage)statsPage.onAnalysisStartDateChange()">
                            <span>至</span>
                            <input type="date" id="analysisEndDate">
                        </div>
                    </div>
                    <div class="control-group">
                        <label>标签</label>
                        <select id="analysisTagSelect" onchange="if(statsPage)statsPage.onAnalysisTagChange()">
                        </select>
                    </div>
                    <div class="control-group">
                        <label>基金</label>
                        <select id="fundSelect">
                            <option value="">-- 选择基金 --</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>基准指数</label>
                        <select id="benchmarkSelect">
                            <option value="">-- 默认（基金配置）--</option>
                        </select>
                    </div>
                    <button class="control-apply-btn" onclick="if(statsPage)statsPage.applyAnalysis()">查询</button>
                    <button class="control-apply-btn btn-crawl" id="btnCrawl" onclick="if(statsPage)statsPage.crawlSingleFund()">爬取</button>
                </div>
            </div>

            <!-- 统计卡片行：收益类 -->
            <div class="card">
                <div class="card-header">
                    <h2>区间统计 <span id="statCardRange" style="font-size:13px;color:var(--text-secondary);font-weight:400;"></span> <span id="statCardBenchmark" style="font-size:13px;color:var(--text-secondary);font-weight:400;margin-left:8px;"></span></h2>
                </div>
                <div class="stat-cards-row">
                    <div class="stat-card">
                        <div class="stat-card-label">
                            区间收益率
                            <span class="help-icon" data-tip="区间收益率=(期末净值/期初净值-1)×100%">?</span>
                        </div>
                        <div class="stat-card-value" id="cardFundReturn">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">
                            基准收益
                            <span class="help-icon" data-tip="基准收益=(期末指数收盘价/期初收盘价-1)×100%。基准指数取自基金配置的组合基准指数。">?</span>
                        </div>
                        <div class="stat-card-value" id="cardBenchmarkReturn">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">
                            超额收益
                            <span class="help-icon" data-tip="超额收益=区间收益率-基准收益。反映基金跑赢/跑输基准的程度。">?</span>
                        </div>
                        <div class="stat-card-value" id="cardExcessReturn">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">
                            区间最大回撤
                            <span class="help-icon" data-tip="区间最大回撤=MAX(净值相对区间峰值最大跌幅)。衡量持有期内最大亏损幅度。">?</span>
                        </div>
                        <div class="stat-card-value" id="cardMaxDrawdown">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">
                            基准回撤
                            <span class="help-icon" data-tip="基准回撤=MAX(基准指数相对区间峰值最大跌幅)。反映基准在区间的最大回撤。">?</span>
                        </div>
                        <div class="stat-card-value" id="cardBenchmarkDrawdown">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">
                            超额回撤
                            <span class="help-icon" data-tip="超额回撤=相对强弱最大回撤。反映基金从领先基准的最大优势位，回落了几个百分点。负值说明基金守住了相对优势。">?</span>
                        </div>
                        <div class="stat-card-value" id="cardExcessDrawdown">--</div>
                    </div>
                </div>
            </div>

            <!-- 统计卡片行：风险指标 -->
            <div class="card">
                <div class="card-header">
                    <h2>风险指标</h2>
                </div>
                <div class="stat-cards-row">
                    <div class="stat-card">
                        <div class="stat-card-label">
                            夏普比率
                            <span class="help-icon" data-tip="夏普=(年化收益率-无风险利率)/年化波动率。无风险利率年化2.1%。衡量每承受1单位风险所获超额收益，越高越好。">?</span>
                        </div>
                        <div class="stat-card-value" id="cardSharpe">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">
                            索提诺比率
                            <span class="help-icon" data-tip="索提诺=(年化收益率-无风险利率)/下行波动率。仅考虑下行风险，比夏普更适配非对称收益基金。">?</span>
                        </div>
                        <div class="stat-card-value" id="cardSortino">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">
                            卡玛比率
                            <span class="help-icon" data-tip="卡玛=年化收益率/|最大回撤|。衡量每承受1单位回撤能获得多少年化收益，越高越好。">?</span>
                        </div>
                        <div class="stat-card-value" id="cardCalmar">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">
                            年化波动率
                            <span class="help-icon" data-tip="年化波动率=日收益率标准差×√252。反映净值波动剧烈程度，越小越稳健。">?</span>
                        </div>
                        <div class="stat-card-value" id="cardVolatility">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-label">
                            年化收益
                            <span class="help-icon" data-tip="年化收益=(期末净值/期初净值)^(365/持有天数)-1。将区间收益率年化后的可比收益。">?</span>
                        </div>
                        <div class="stat-card-value" id="cardAnnReturn">--</div>
                    </div>
                </div>
            </div>

            <!-- 主图：净值与基准指数 -->
            <div class="card">
                <div class="card-header">
                    <h2>收益走势</h2>
                </div>
                <div class="chart-container">
                    <div id="navChart" style="width:100%;height:380px;"></div>
                </div>
            </div>

            <!-- 副图：回撤分析 -->
            <div class="card">
                <div class="card-header">
                    <h2>回撤分析</h2>
                </div>
                <div class="chart-container">
                    <div id="drawdownAnalysisChart" style="width:100%;height:280px;"></div>
                </div>
            </div>
        </div>

        <!-- ==================== 爬取记录 Tab ==================== -->
        <div id="tab-records" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h2>爬取记录</h2>
                    <div class="card-header-right">
                        <div class="tag-tabs" id="statsTagTabs"></div>
                        <div class="export-dropdown" id="statsExportDropdown">
                            <button class="btn btn-secondary btn-small" onclick="if(statsPage)statsPage.toggleStatsExportMenu()">
                                导出 &#9660;
                            </button>
                            <div class="dropdown-menu" id="statsExportMenu" style="display:none;">
                                <a href="#" onclick="if(statsPage){statsPage.exportStatsData('csv');return false;}">CSV</a>
                                <a href="#" onclick="if(statsPage){statsPage.exportStatsData('json');return false;}">JSON</a>
                                <a href="#" onclick="if(statsPage){statsPage.exportStatsData('xlsx');return false;}">Excel</a>
                            </div>
                        </div>
                    </div>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>爬取日期</th>
                            <th>开始时间</th>
                            <th>结束时间</th>
                            <th>状态</th>
                            <th>基金数量</th>
                            <th>OCR成功</th>
                            <th>错误信息</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="crawlRecordsBody">
                        <tr>
                            <td colspan="9" class="loading-cell">
                                <div class="loading">加载中...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="pagination" id="crawlRecordsPagination"></div>
            </div>
        </div>
    </div>

    <!-- 保留必要的全局函数供其他页面使用 -->
    <script>
        // ==================== 全局辅助函数 ====================

        function switchMainTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
        }
    </script>
</body>
</html>
