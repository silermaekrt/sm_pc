<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私募基金监控平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>私募基金监控平台</h1>
            <div class="header-right">
                <span class="status-indicator" id="crawlStatus">
                    <span class="dot"></span>
                    <span class="status-text">空闲</span>
                </span>
                <button class="btn btn-primary" id="triggerCrawlBtn" onclick="showCrawlModal()">触发抓取</button>
                <button class="btn btn-secondary" onclick="location.href='/stats'">统计分析</button>
            </div>
        </header>

        <div class="toolbar">
            <div></div>
            <div class="toolbar-right">
                <div class="checkbox-group">
                    <label><input type="checkbox" id="showLatestCard" checked onchange="onCardToggleChange()"> 最新数据</label>
                    <label><input type="checkbox" id="showFundListCard" checked onchange="onCardToggleChange()"> 基金列表</label>
                </div>
                <button class="btn btn-secondary" onclick="showLoginModal()">登录设置</button>
            </div>
        </div>

        <!-- 最新数据卡片 -->
        <div class="card" id="latestDataCard">
            <div class="card-header">
                <h2>最新数据</h2>
                <div class="card-header-right">
                    <span class="record-count" id="latestCount">共 0 条</span>
                    <div class="export-dropdown" id="latestExportDropdown">
                        <button class="btn btn-secondary btn-small" onclick="toggleLatestExportMenu()">导出 &#9660;</button>
                        <div class="dropdown-menu" id="latestExportMenu" style="display:none;">
                            <a href="#" onclick="exportLatestData('csv'); return false;">CSV</a>
                            <a href="#" onclick="exportLatestData('json'); return false;">JSON</a>
                            <a href="#" onclick="exportLatestData('xlsx'); return false;">Excel</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="toolbar" style="margin:0;padding:12px 16px;border-bottom:1px solid var(--border-color);">
                <div class="toolbar-left"><div class="tag-tabs" id="latestTagTabs"></div></div>
                <div class="toolbar-right">
                    <div class="search-box">
                        <input type="text" id="latestSearchInput" placeholder="搜索基金名称..." oninput="debounceLatestSearch()">
                        <span class="search-icon" onclick="latestSearch()">&#128269;</span>
                    </div>
                    <div class="filter-box">
                        <select id="latestDateFilter" onchange="loadLatestFunds(1)"><option value="">全部日期</option></select>
                    </div>
                    <div class="filter-box">
                        <select id="latestSortSelect" onchange="loadLatestFunds(1)">
                            <option value="crawl_time-desc">按爬取时间 (最新)</option>
                            <option value="fund_name-asc">按基金名称 (A-Z)</option>
                            <option value="this_year-desc">按今年来 (降序)</option>
                            <option value="three_year-desc">按近三年 (降序)</option>
                            <option value="drawdown-asc">按回撤 (升序)</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>基金名称</th><th>基金代码</th><th>策略</th><th>净值日期</th><th>最新净值</th>
                            <th>净值变动</th><th>成立来年化</th><th>今年来</th><th>上周</th><th>近一月</th>
                            <th>近三月</th><th>近半年</th><th>近一年</th><th>近两年</th><th>近三年</th>
                            <th>近五年</th><th>成立来</th><th>本周</th><th>回撤</th><th>爬取时间</th>
                        </tr>
                    </thead>
                    <tbody id="latestTableBody">
                        <tr><td colspan="20" class="loading-cell"><div class="loading"></div></td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="latestPagination"></div>
        </div>

        <!-- 基金列表卡片 -->
        <div class="card" id="fundListCard">
            <div class="card-header">
                <h2>基金列表</h2>
                <div class="card-header-right">
                    <span class="record-count" id="recordCount">共 0 条记录</span>
                    <div class="export-dropdown" id="fundListExportDropdown">
                        <button class="btn btn-secondary btn-small" onclick="toggleFundListExportMenu()">导出 &#9660;</button>
                        <div class="dropdown-menu" id="fundListExportMenu" style="display:none;">
                            <a href="#" onclick="exportFundListData('csv'); return false;">CSV</a>
                            <a href="#" onclick="exportFundListData('json'); return false;">JSON</a>
                            <a href="#" onclick="exportFundListData('xlsx'); return false;">Excel</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="toolbar" style="margin:0;padding:12px 16px;border-bottom:1px solid var(--border-color);">
                <div class="toolbar-left"><div class="tag-tabs" id="fundListTagTabs"></div></div>
                <div class="toolbar-right">
                    <div class="search-box">
                        <input type="text" id="fundSearchInput" placeholder="搜索基金名称..." oninput="debounceFundSearch()">
                        <span class="search-icon" onclick="fundSearch()">&#128269;</span>
                    </div>
                    <div class="filter-box">
                        <select id="dateFilter" onchange="loadFunds(1)"><option value="">全部日期</option></select>
                    </div>
                    <div class="filter-box">
                        <select id="sortSelect" onchange="loadFunds(1)">
                            <option value="crawl_time-desc">按爬取时间 (最新)</option>
                            <option value="fund_name-asc">按基金名称 (A-Z)</option>
                            <option value="this_year-desc">按今年来 (降序)</option>
                            <option value="three_year-desc">按近三年 (降序)</option>
                            <option value="drawdown-asc">按回撤 (升序)</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>基金名称</th><th>基金代码</th><th>策略</th><th>净值日期</th><th>最新净值</th>
                            <th>净值变动</th><th>成立来年化</th><th>今年来</th><th>上周</th><th>近一月</th>
                            <th>近三月</th><th>近半年</th><th>近一年</th><th>近两年</th><th>近三年</th>
                            <th>近五年</th><th>成立来</th><th>本周</th><th>回撤</th><th>爬取时间</th>
                        </tr>
                    </thead>
                    <tbody id="fundTableBody">
                        <tr><td colspan="20" class="loading-cell"><div class="loading"></div></td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>

        <!-- 登录设置弹窗 -->
        <div class="modal" id="loginModal">
            <div class="modal-content" style="max-width:480px;">
                <div class="modal-header">
                    <h3>登录设置</h3>
                    <button class="modal-close" onclick="closeLoginModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <p class="login-hint">保存私募排排网用户名密码后，系统将自动刷新 Cookie，无需手动更新。</p>
                    <form id="loginForm" onsubmit="submitLogin(event)">
                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" id="loginUsername" placeholder="请输入用户名" required>
                        </div>
                        <div class="form-group">
                            <label>密码</label>
                            <input type="password" id="loginPassword" placeholder="请输入密码" required>
                        </div>
                        <div class="form-group">
                            <label>刷新间隔（分钟）</label>
                            <input type="number" id="loginInterval" value="60" min="10" max="1440">
                            <small>Cookie 过期前自动刷新，建议 60 分钟</small>
                        </div>
                        <div class="form-status" id="loginStatus"></div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="manualRefreshCookies()">立即刷新</button>
                            <button type="submit" class="btn btn-primary">保存设置</button>
                        </div>
                    </form>
                    <div class="login-credential-status" id="credentialStatus"></div>
                </div>
            </div>
        </div>

        <!-- 触发爬取弹窗 -->
        <div class="modal" id="crawlModal">
            <div class="modal-content" style="max-width:400px;">
                <div class="modal-header">
                    <h3>触发爬取</h3>
                    <button class="modal-close" onclick="closeCrawlModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <p class="login-hint">选择要爬取的基金类型：</p>
                    <div class="form-group">
                        <label>基金标签</label>
                        <div class="checkbox-group" id="crawlTagsGroup"></div>
                    </div>
                    <div class="form-status" id="crawlModalStatus"></div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeCrawlModal()">取消</button>
                        <button type="button" class="btn btn-primary" onclick="submitCrawl()">开始爬取</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>document.addEventListener('DOMContentLoaded', init);</script>
</body>
</html>
